<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araba Yarışı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            text-align: center;
        }
        
        canvas {
            border: 3px solid #34495e;
            background-color: #7f8c8d;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        #info {
            color: white;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div id="info">
            <p>🎮 Ok tuşları ile arabayı hareket ettirin</p>
            <p>Rakip arabalardan kaçının ve puan kazanın!</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Oyun ayarları
        const WIDTH = 600;
        const HEIGHT = 800;

        // Renkler
        const BEYAZ = '#FFFFFF';
        const SIYAH = '#000000';
        const KIRMIZI = '#FF0000';
        const MAVI = '#0000FF';
        const YESIL = '#00FF00';
        const SARI = '#FFFF00';
        const GRI = '#808080';
        const ACIK_MAVI = '#64C8FF';

        // Oyun değişkenleri
        let oyuncu = {
            x: WIDTH / 2,
            y: HEIGHT - 120,
            genislik: 40,
            yukseklik: 70,
            hiz: 2
        };

        let rakipArabalar = [];
        let rakipHiz = 3;
        let rakipSpawnZamani = 0;

        let yolCizgileri = [];
        let yolHizi = 2;

        let puan = 0;
        let oyunBitti = false;
        let enYuksekPuan = 0;

        // Klavye kontrolleri
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            // Oyun bittiyse ve Space'e basıldıysa yeniden başlat
            if (oyunBitti && e.key === ' ') {
                oyunBaslat();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Yol çizgilerini oluştur
        function yolCizgileriOlustur() {
            yolCizgileri = [];
            for (let i = 0; i < HEIGHT + 100; i += 100) {
                yolCizgileri.push(i);
            }
        }

        // Rakip araba oluştur
        function rakipOlustur() {
            const xPozisyonlari = [150, 250, 350, 450];
            const x = xPozisyonlari[Math.floor(Math.random() * xPozisyonlari.length)];
            const renkler = [KIRMIZI, SARI, YESIL];
            const renk = renkler[Math.floor(Math.random() * renkler.length)];
            
            return {
                x: x,
                y: -100,
                genislik: 40,
                yukseklik: 70,
                renk: renk
            };
        }

        // Çarpışma kontrolü
        function carpismaKontrolu(obj1, obj2) {
            return (obj1.x < obj2.x + obj2.genislik &&
                    obj1.x + obj1.genislik > obj2.x &&
                    obj1.y < obj2.y + obj2.yukseklik &&
                    obj1.y + obj1.yukseklik > obj2.y);
        }

        // Oyuncu arabasını çiz
        function oyuncuArabaCiz() {
            // Ana gövde
            ctx.fillStyle = MAVI;
            ctx.fillRect(oyuncu.x - oyuncu.genislik / 2, 
                        oyuncu.y - oyuncu.yukseklik / 2,
                        oyuncu.genislik, 
                        oyuncu.yukseklik);
            
            // Ön cam
            ctx.fillStyle = ACIK_MAVI;
            ctx.fillRect(oyuncu.x - 15, oyuncu.y - 25, 30, 20);
            
            // Arka cam
            ctx.fillRect(oyuncu.x - 15, oyuncu.y + 10, 30, 15);
            
            // Tekerlekler
            ctx.fillStyle = SIYAH;
            ctx.fillRect(oyuncu.x - 18, oyuncu.y - 20, 8, 15);
            ctx.fillRect(oyuncu.x + 10, oyuncu.y - 20, 8, 15);
            ctx.fillRect(oyuncu.x - 18, oyuncu.y + 5, 8, 15);
            ctx.fillRect(oyuncu.x + 10, oyuncu.y + 5, 8, 15);
        }

        // Rakip arabayı çiz
        function rakipArabaCiz(rakip) {
            // Ana gövde
            ctx.fillStyle = rakip.renk;
            ctx.fillRect(rakip.x, rakip.y, rakip.genislik, rakip.yukseklik);
            
            // Araba detayları
            ctx.fillStyle = BEYAZ;
            ctx.fillRect(rakip.x + 5, rakip.y + 45, 10, 15);
            ctx.fillRect(rakip.x + 25, rakip.y + 45, 10, 15);
        }

        // Çizim fonksiyonu
        function draw() {
            // Arkaplan
            ctx.fillStyle = GRI;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Yol kenarları
            ctx.fillStyle = YESIL;
            ctx.fillRect(0, 0, 100, HEIGHT);
            ctx.fillRect(WIDTH - 100, 0, 100, HEIGHT);
            
            // Yol
            ctx.fillStyle = SIYAH;
            ctx.fillRect(100, 0, WIDTH - 200, HEIGHT);
            
            // Yol çizgileri
            ctx.fillStyle = BEYAZ;
            yolCizgileri.forEach(cizgiY => {
                ctx.fillRect(WIDTH / 2 - 5, cizgiY, 10, 50);
            });
            
            if (!oyunBitti) {
                // Oyuncu arabası
                oyuncuArabaCiz();
                
                // Rakip arabalar
                rakipArabalar.forEach(rakip => {
                    rakipArabaCiz(rakip);
                });
                
                // Puan
                ctx.fillStyle = BEYAZ;
                ctx.font = '36px Arial';
                ctx.fillText(`Puan: ${puan}`, 10, 40);
            } else {
                // Oyun bitti ekranı
                ctx.fillStyle = KIRMIZI;
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('OYUN BİTTİ!', WIDTH / 2, HEIGHT / 2 - 50);
                
                ctx.fillStyle = BEYAZ;
                ctx.font = '40px Arial';
                ctx.fillText(`Puanınız: ${puan}`, WIDTH / 2, HEIGHT / 2 + 20);
                ctx.fillText(`En Yüksek Puan: ${enYuksekPuan}`, WIDTH / 2, HEIGHT / 2 + 70);
                
                ctx.fillStyle = SARI;
                ctx.font = '30px Arial';
                ctx.fillText('Yeniden oynamak için SPACE\'e basın', WIDTH / 2, HEIGHT / 2 + 130);
                
                ctx.textAlign = 'left';
            }
        }

        // Güncelleme fonksiyonu
        function update() {
            if (oyunBitti) return;
            
            // Klavye kontrolleri
            if (keys['ArrowLeft'] && oyuncu.x - oyuncu.genislik / 2 > 110) {
                oyuncu.x -= oyuncu.hiz;
            }
            if (keys['ArrowRight'] && oyuncu.x + oyuncu.genislik / 2 < WIDTH - 110) {
                oyuncu.x += oyuncu.hiz;
            }
            if (keys['ArrowUp'] && oyuncu.y - oyuncu.yukseklik / 2 > 0) {
                oyuncu.y -= oyuncu.hiz;
            }
            if (keys['ArrowDown'] && oyuncu.y + oyuncu.yukseklik / 2 < HEIGHT) {
                oyuncu.y += oyuncu.hiz;
            }
            
            // Yol çizgilerini hareket ettir
            yolCizgileri = yolCizgileri.map(y => {
                let yeniY = y + yolHizi;
                if (yeniY > HEIGHT) {
                    yeniY = -50;
                }
                return yeniY;
            });
            
            // Rakip arabalar oluştur
            rakipSpawnZamani++;
            if (rakipSpawnZamani > 60) {
                rakipArabalar.push(rakipOlustur());
                rakipSpawnZamani = 0;
            }
            
            // Rakip arabaları hareket ettir
            for (let i = rakipArabalar.length - 1; i >= 0; i--) {
                const rakip = rakipArabalar[i];
                rakip.y += rakipHiz;
                
                // Çarpışma kontrolü
                const oyuncuHitbox = {
                    x: oyuncu.x - oyuncu.genislik / 2,
                    y: oyuncu.y - oyuncu.yukseklik / 2,
                    genislik: oyuncu.genislik,
                    yukseklik: oyuncu.yukseklik
                };
                
                if (carpismaKontrolu(oyuncuHitbox, rakip)) {
                    oyunBitti = true;
                    if (puan > enYuksekPuan) {
                        enYuksekPuan = puan;
                    }
                    return;
                }
                
                // Ekrandan çıkan arabaları kaldır ve puan ekle
                if (rakip.y > HEIGHT) {
                    rakipArabalar.splice(i, 1);
                    puan += 10;
                    
                    // Zorluk artışı
                    if (puan % 100 === 0 && rakipHiz < 8) {
                        rakipHiz += 0.5;
                    }
                }
            }
        }

        // Oyunu başlat
        function oyunBaslat() {
            oyuncu.x = WIDTH / 2;
            oyuncu.y = HEIGHT - 120;
            rakipArabalar = [];
            rakipSpawnZamani = 0;
            puan = 0;
            oyunBitti = false;
            rakipHiz = 3;
            yolCizgileriOlustur();
        }

        // Oyun döngüsü
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Oyunu başlat ve döngüyü çalıştır
        oyunBaslat();
        gameLoop();
    </script>
</body>
</html>
